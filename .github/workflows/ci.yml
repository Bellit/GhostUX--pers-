name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Start plain backend server
        working-directory: backend
        run: |
          node run-server-plain.js &
          # wait for server to start
          for i in 1 2 3 4; do
            nc -z localhost 3000 && break || sleep 1
          done

      - name: Run integration test
        working-directory: backend
        run: node test/integration.js
name: CI

on:
  push:
    branches: [ main, 'ci/**', 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: "Backend: install & test"
        working-directory: backend
        run: |
          npm ci || npm install
          # placeholder for tests
          if [ -f package.json ]; then npm run test || echo "No tests configured"; fi

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: "Analytics: deps & tests"
        working-directory: analytics
        run: |
          if [ -f requirements.txt ]; then python -m pip install --upgrade pip && pip install -r requirements.txt; fi
          # placeholder for analytics tests
          echo "No analytics tests configured"
