version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ghostux
      POSTGRES_PASSWORD: ghostux
      POSTGRES_DB: ghostux
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - 6379:6379

volumes:
  pgdata:
